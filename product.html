<link rel="preconnect" href="https://fonts.googleapis.com" />

<style>
:root{--pink:#e91e8c;--pink-dark:#c91875;--pink-light:#fce7f3;--text:#18181b;--muted:#71717a;--line:#ececf0;--soft:#f7f7f9;--white:#fff;--green:#22c55e;--shadow:0 18px 60px rgba(15,15,25,.10);--radius:18px;--font:'Inter',Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;font-family:var(--font);color:var(--text);background:linear-gradient(180deg,#fff 0%,#fafafa 58%,#fff 100%)}a{color:inherit;text-decoration:none}button,input,textarea{font-family:inherit}.container{width:min(1180px,calc(100% - 32px));margin:0 auto}.header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.88);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.nav{height:74px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--pink),#ff75bd);color:#fff;display:grid;place-items:center;transform:rotate(45deg);box-shadow:0 10px 24px rgba(233,30,140,.22)}.logo span{transform:rotate(-45deg)}.brand small{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-top:2px}.navlinks{display:flex;align-items:center;gap:10px}.navlinks a,.cart-mini{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font-size:13px;font-weight:700;color:#3f3f46;cursor:pointer}.navlinks a:hover,.cart-mini:hover{border-color:rgba(233,30,140,.35);color:var(--pink)}.cart-count{display:inline-grid;place-items:center;min-width:20px;height:20px;margin-left:5px;border-radius:999px;background:var(--pink);color:#fff;font-size:11px}.back{display:inline-flex;align-items:center;gap:8px;margin:26px 0 18px;color:var(--muted);font-size:14px;font-weight:700}.back:hover{color:var(--pink)}.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,.86fr);gap:38px;align-items:start}.gallery{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow)}.main-img{aspect-ratio:1/1;background:var(--soft);border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.main-img img{max-width:100%;max-height:100%;object-fit:contain}.placeholder{padding:28px;text-align:center;color:#a1a1aa;font-weight:800}.info{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);position:sticky;top:96px}.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:16px}.crumbs span:not(:last-child)::after{content:'\203A';margin-left:8px;color:#c4c4cc}.brand-pill{display:inline-flex;padding:6px 12px;background:var(--pink-light);color:var(--pink);border-radius:999px;font-size:12px;font-weight:800;margin-bottom:12px}.title{font-size:30px;line-height:1.18;margin:0 0 14px;letter-spacing:0}.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}.meta span{font-size:13px;font-weight:700;color:#52525b;background:#f5f5f6;border:1px solid var(--line);border-radius:999px;padding:8px 10px}.prices{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}.price{font-size:34px;font-weight:800;color:var(--pink)}.old{font-size:18px;color:#a1a1aa;text-decoration:line-through;font-weight:700}.discount{font-size:12px;font-weight:800;color:#dc2626;background:#fee2e2;border-radius:999px;padding:6px 10px}.request-price{color:var(--pink);font-weight:800;font-size:17px;margin:8px 0 18px}.save{color:var(--green);font-size:14px;font-weight:800;margin-bottom:18px}.stock{display:flex;align-items:center;gap:8px;color:var(--green);font-weight:800;font-size:14px;margin:16px 0}.panel{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}.panel h3{font-size:15px;margin:0 0 12px}.specs{display:grid;gap:8px}.spec{display:flex;justify-content:space-between;gap:18px;border-bottom:1px solid #f0f0f2;padding:9px 0;font-size:13px}.spec span:first-child{color:var(--muted)}.spec span:last-child{font-weight:700;text-align:right}.warranty{display:grid;gap:8px}.warranty button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;text-align:left;font-size:13px;font-weight:700;cursor:pointer}.warranty button.active,.warranty button:hover{border-color:var(--pink);background:var(--pink-light);color:var(--pink)}.delivery{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:12px;padding:14px;color:#52525b;font-size:13px;line-height:1.5}.actions{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:20px}.add{border:0;background:var(--pink);color:#fff;border-radius:14px;padding:15px 18px;font-weight:800;font-size:15px;cursor:pointer}.add:hover{background:var(--pink-dark)}.add.added{background:var(--green)}.call{border:1.5px solid var(--line);background:#fff;color:#27272a;border-radius:14px;padding:15px 18px;font-weight:800;white-space:nowrap}.section-title{font-size:20px;margin:42px 0 18px}.related{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:48px}.rel-card{border:1px solid var(--line);background:#fff;border-radius:16px;overflow:hidden;transition:.2s;display:flex;flex-direction:column;min-height:100%}.rel-card:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(15,15,25,.08);border-color:rgba(233,30,140,.25)}.rel-img{height:150px;background:var(--soft);display:flex;align-items:center;justify-content:center;padding:14px}.rel-img img{max-width:100%;max-height:100%;object-fit:contain}.rel-body{padding:13px}.rel-brand{font-size:11px;color:var(--pink);font-weight:800;margin-bottom:6px}.rel-name{font-size:13px;font-weight:800;line-height:1.35;min-height:36px}.rel-price{margin-top:10px;font-size:15px;font-weight:800}.not-found{min-height:54vh;display:grid;place-items:center;text-align:center}.not-found h1{font-size:30px;margin:0 0 10px}.not-found p{color:var(--muted)}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);opacity:0;background:#18181b;color:#fff;border-radius:999px;padding:12px 16px;font-size:13px;font-weight:800;transition:.24s;z-index:100}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:900px){.nav{height:auto;padding:14px 0;align-items:flex-start}.navlinks{flex-wrap:wrap;justify-content:flex-end}.detail{grid-template-columns:1fr}.info{position:static}.related{grid-template-columns:repeat(2,minmax(0,1fr))}.title{font-size:24px}.price{font-size:28px}}@media(max-width:560px){.container{width:min(100% - 22px,1180px)}.nav{gap:12px}.brand small{display:none}.navlinks a{display:none}.cart-mini{padding:9px 11px}.gallery,.info{padding:18px;border-radius:14px}.actions{grid-template-columns:1fr}.call{text-align:center}.related{grid-template-columns:1fr}.rel-img{height:180px}}
</style>
</head>
<body>
<header class="header">
  <div class="container nav">
    <a class="brand" href="index.html"><span class="logo"><span>A</span></span><span>Alto<span style="color:var(--pink)">.</span> Hausgerate<small>R&#601;smi distrib&#252;tor</small></span></a>
    <nav class="navlinks" aria-label="&#399;sas ke&#231;idl&#601;r">
      <a href="index.html#products">M&#601;hsullar</a>
      <a href="index.html#brands">Brendl&#601;r</a>
      <a href="index.html#contact">&#399;laq&#601;</a>
      <button class="cart-mini" type="button" onclick="location.href='index.html#products'">S&#601;b&#601;t <span class="cart-count" id="cartCount">0</span></button>
    </nav>
  </div>
</header>
<main class="container" id="app"></main>
<div class="toast" id="toast">S&#601;b&#601;t&#601; &#601;lav&#601; olundu</div>
<script src="products-data.js"></script>
<script>
const PROD = window.PROD || [];
const fallbackImg = 'img/products/1_org_zoom.jpg';
const AZ = {
  back: 'M\u0259hsullara qay\u0131t', products: 'M\u0259hsullar', brands: 'Brendl\u0259r', contact: '\u018flaq\u0259', cart: 'S\u0259b\u0259t',
  inStock: 'Stokda var', deliveryShort: '\u00c7atd\u0131r\u0131lma: 1-3 i\u015f g\u00fcn\u00fc', warranty2: 'Z\u0259man\u0259t: 2 il',
  priceRequest: 'Qiym\u0259t sor\u011fusu \u00fc\u00e7\u00fcn z\u0259ng edin', save: 'q\u0259na\u0259t edirsiniz', specs: 'Texniki x\u00fcsusiyy\u0259tl\u0259r',
  warrantyChoice: 'Z\u0259man\u0259t se\u00e7imi', standardWarranty: 'Standart (2 il) - Pulsuz', extendedWarranty: 'Uzad\u0131lm\u0131\u015f (3 il) - +',
  freeDelivery: '400 AZN-d\u0259n yuxar\u0131 sifari\u015fl\u0259rd\u0259 <strong>pulsuz \u00e7atd\u0131r\u0131lma</strong>. Bak\u0131 \u00fczr\u0259 1-3 i\u015f g\u00fcn\u00fc.',
  addToCart: 'S\u0259b\u0259t\u0259 \u0259lav\u0259 et', added: 'S\u0259b\u0259t\u0259 \u0259lav\u0259 olundu', call: 'Z\u0259ng et', callForPrice: 'Qiym\u0259t \u00fc\u00e7\u00fcn z\u0259ng et',
  related: 'Ox\u015far m\u0259hsullar', notFound: 'M\u0259hsul tap\u0131lmad\u0131', notFoundText: 'Bu linkd\u0259 m\u0259hsul yoxdur v\u0259 ya katalog yenil\u0259nib.',
  code: 'M\u0259hsul kodu', priceInquiry: 'Qiym\u0259t sor\u011fusu', official: 'R\u0259smi distrib\u00fctor'
};
const params = new URLSearchParams(location.search);
const id = Number(params.get('id'));
const product = PROD.find(p => p.id === id);
const app = document.getElementById('app');
const money = n => Number(n || 0).toFixed(2) + ' \u20bc';
const imgSrc = p => p && p.img ? p.img : fallbackImg;
function productUrl(p){ return 'product.html?id=' + encodeURIComponent(p.id); }
function getCart(){ return JSON.parse(localStorage.getItem('au_cart') || '[]'); }
function saveCart(cart){ localStorage.setItem('au_cart', JSON.stringify(cart)); updateCartCount(); }
function updateCartCount(){ const count = getCart().reduce((sum,item)=>sum + (item.qty || 0), 0); const el = document.getElementById('cartCount'); if(el) el.textContent = count; }
function addToCart(id){ const p = PROD.find(x=>x.id===id); if(!p || !p.rrp) return; const cart = getCart(); const existing = cart.find(i=>i.id===id); if(existing){ existing.qty++; } else { cart.push({...p, qty:1}); } saveCart(cart); const btn=document.getElementById('addBtn'); if(btn){btn.textContent=AZ.added; btn.classList.add('added'); setTimeout(()=>{btn.textContent=AZ.addToCart; btn.classList.remove('added');},1600)} showToast(); }
function showToast(){ const t=document.getElementById('toast'); t.textContent=AZ.added; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1500); }
function setWarranty(btn){ document.querySelectorAll('.warranty button').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
function escapeHtml(value){ return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function renderImage(p){
  const safeSrc = escapeHtml(imgSrc(p));
  const safeAlt = escapeHtml(p.name);
  return '<img src="'+safeSrc+'" alt="'+safeAlt+'" onerror="this.remove();this.parentNode.classList.add(\'placeholder\');this.parentNode.textContent=this.getAttribute(\'alt\').split(\' \').slice(0,3).join(\' \')" />';
}
function specsHtml(p){
  const specs = Object.assign({}, p.specs || {}, {Brend:p.brand, Kateqoriya:p.cat, [AZ.code]:'#'+p.id});
  return Object.keys(specs).map(k=>'<div class="spec"><span>'+escapeHtml(k)+'</span><span>'+escapeHtml(specs[k])+'</span></div>').join('');
}
function relatedHtml(p){
  return PROD.filter(x=>x.id!==p.id && (x.cat===p.cat || x.brand===p.brand)).slice(0,4).map(x=>'<a class="rel-card" href="'+productUrl(x)+'"><div class="rel-img">'+renderImage(x)+'</div><div class="rel-body"><div class="rel-brand">'+escapeHtml(x.brand)+'</div><div class="rel-name">'+escapeHtml(x.name)+'</div><div class="rel-price">'+(x.rrp ? money(x.rrp) : AZ.priceInquiry)+'</div></div></a>').join('');
}
function renderProduct(p){
  const disc = p.mrp && p.rrp ? Math.round((1 - p.rrp / p.mrp) * 100) : 0;
  const savings = p.mrp && p.rrp ? p.mrp - p.rrp : 0;
  document.title = p.name + ' | Alto. Hausgerate';
  app.innerHTML = '<a class="back" href="index.html#products">&larr; '+AZ.back+'</a><section class="detail"><div class="gallery"><div class="main-img">'+renderImage(p)+'</div></div><aside class="info"><div class="crumbs"><span>Alto</span><span>'+escapeHtml(p.brand)+'</span><span>'+escapeHtml(p.cat)+'</span></div><span class="brand-pill">'+escapeHtml(p.brand)+'</span><h1 class="title">'+escapeHtml(p.name)+'</h1><div class="meta"><span>'+AZ.inStock+'</span><span>'+AZ.deliveryShort+'</span><span>'+AZ.warranty2+'</span></div>'+(p.rrp ? '<div class="prices"><span class="price">'+money(p.rrp)+'</span>'+(p.mrp!==p.rrp ? '<span class="old">'+money(p.mrp)+'</span><span class="discount">-'+disc+'%</span>' : '')+'</div>'+(savings>0 ? '<div class="save">'+money(savings)+' '+AZ.save+'</div>' : '') : '<div class="request-price">'+AZ.priceRequest+'</div>')+'<div class="stock">&#10003; '+AZ.inStock+'</div><div class="panel"><h3>'+AZ.specs+'</h3><div class="specs">'+specsHtml(p)+'</div></div><div class="panel"><h3>'+AZ.warrantyChoice+'</h3><div class="warranty"><button class="active" type="button" onclick="setWarranty(this)">'+AZ.standardWarranty+'</button><button type="button" onclick="setWarranty(this)">'+AZ.extendedWarranty+(p.rrp ? money(p.rrp * 0.05) : '0.00 \u20bc')+'</button></div></div><div class="panel"><div class="delivery">&#128666; <span>'+AZ.freeDelivery+'</span></div></div><div class="actions">'+(p.rrp ? '<button class="add" id="addBtn" type="button" onclick="addToCart('+p.id+')">'+AZ.addToCart+'</button>' : '<a class="add" href="tel:+994517290386" style="text-align:center">'+AZ.callForPrice+'</a>')+'<a class="call" href="tel:+994517290386">'+AZ.call+'</a></div></aside></section><h2 class="section-title">'+AZ.related+'</h2><section class="related">'+relatedHtml(p)+'</section>';
}
if(!product){ app.innerHTML = '<section class="not-found"><div><h1>'+AZ.notFound+'</h1><p>'+AZ.notFoundText+'</p><p><a class="back" href="index.html#products">&larr; '+AZ.back+'</a></p></div></section>'; } else { renderProduct(product); }
updateCartCount();
</script>
</body>
</html>
